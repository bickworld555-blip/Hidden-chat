apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// Step 5: the native Kotlin/Compose UI (off by default — no launcher points at it yet).
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def signingValues = [
    path: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_STORE_PASSWORD'),
    alias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningReady = signingValues.values().every { it }

android {
    namespace = "io.github.bickworld555.hiddenchat"
    compileSdk = rootProject.ext.compileSdkVersion
    // whisper.cpp, the offline speech-to-text fallback (src/main/cpp): native code for 64-bit ARM phones only.
    ndkVersion = "27.1.12297006"
    // whisper's math library picks its CPU variant by loading a file from the app's library folder, so native
    // libraries are extracted at install time (they are otherwise read straight from the APK).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
    // The JVM unit tests run in a forked VM; keep it small so the build fits beside the Kotlin compiler on low-RAM machines.
    testOptions {
        unitTests.all {
            maxHeapSize = "200m"
            jvmArgs "-XX:+UseSerialGC", "-XX:MaxMetaspaceSize=160m"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        // Back-ports java.time, java.util.Base64 etc. to minSdk 24, so the native core's java.util.Base64
        // (core/crypto/Primitives.kt) is safe on API 24-25 while the JVM unit tests keep running on real java.util.
        coreLibraryDesugaringEnabled true
    }
    // Step 5: Jetpack Compose for the native UI (behind a flag; no launcher reaches it yet).
    buildFeatures {
        compose true
    }
    defaultConfig {
        applicationId "io.github.bickworld555.hiddenchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                // Only the CMake library is limited to arm64; the rest of the APK keeps every ABI it had.
                abiFilters 'arm64-v8a'
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        // The translation lab (src/debug, measurements): installs beside the real app as "HM Lab".
        debug {
            applicationIdSuffix ".lab"
            versionNameSuffix "-lab"
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach {
    // google-services.json only knows the real package; the lab build runs without push.
    if (name == 'processDebugGoogleServices') enabled = false
    if (name == 'preReleaseBuild') {
        doFirst {
            // Expo EAS builds sign with the EAS-managed keystore it injects; everywhere else our own keystore is required.
            if (!releaseSigningReady && System.getenv('EAS_BUILD') != 'true') {
                throw new GradleException('Release APK requires ANDROID_KEYSTORE_PATH, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Settings › Storage and data › Proxy: the web view's proxy override (AppProxy.java).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Media upload quality › Standard for videos: re-encoding on the phone (VideoCompressor.java).
    implementation "androidx.media3:media3-transformer:1.8.0"
    implementation "androidx.media3:media3-effect:1.8.0"
    implementation "androidx.media3:media3-common:1.8.0"
    // WebSocket client for the background service's own connection (NativeRelay).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Native WebRTC media for calls (libwebrtc, org.webrtc API), replacing the WebView's WebRTC stack (Step 4).
    implementation 'io.github.webrtc-sdk:android:125.6422.07'
    // Step 5: Jetpack Compose for the native UI (off by default). The BOM aligns the Compose artifact versions.
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // App lock: the phone's biometrics or screen-lock credential (AppSecurity.java).
    implementation 'androidx.biometric:biometric:1.1.0'
    // The local database's one-time switch to a raw SQLCipher key (DatabaseKey): the same versions the SQLite plugin uses.
    implementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Firebase Cloud Messaging: pushes wake the idle app for messages and calls (no always-on connection).
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Voice message translation on the phone (VoiceTranslator): Google ML Kit on-device translation.
    implementation 'com.google.mlkit:translate:17.0.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json may be kept at the project root (next to package.json); the plugin reads it from here.
def rootServicesJSON = rootProject.file('../google-services.json')
if (!file('google-services.json').exists() && rootServicesJSON.exists()) {
    copy { from rootServicesJSON; into projectDir }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// The native core is Kotlin; JVM unit tests (app/src/test) run it on the computer without Android.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
