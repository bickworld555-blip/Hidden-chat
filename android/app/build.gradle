apply plugin: 'com.android.application'

def signingValues = [
    path: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_STORE_PASSWORD'),
    alias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningReady = signingValues.values().every { it }

android {
    namespace = "io.github.bickworld555.hiddenchat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.bickworld555.hiddenchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        doFirst {
            // Expo EAS builds sign with the EAS-managed keystore it injects; everywhere else our own keystore is required.
            if (!releaseSigningReady && System.getenv('EAS_BUILD') != 'true') {
                throw new GradleException('Release APK requires ANDROID_KEYSTORE_PATH, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // WebSocket client for the background service's own connection (NativeRelay).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // App lock: the phone's biometrics or screen-lock credential (AppSecurity.java).
    implementation 'androidx.biometric:biometric:1.1.0'
    // Firebase Cloud Messaging: pushes wake the idle app for messages and calls (no always-on connection).
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json may be kept at the project root (next to package.json); the plugin reads it from here.
def rootServicesJSON = rootProject.file('../google-services.json')
if (!file('google-services.json').exists() && rootServicesJSON.exists()) {
    copy { from rootServicesJSON; into projectDir }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
