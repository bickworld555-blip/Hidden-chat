# Port 443 shared by TLS server name (turn-443.md): turn.p2pchat.tech → coturn's TLS listener, everything else → the
# HTTPS site, now on 127.0.0.1:8443. Goes at the top level of /etc/nginx/nginx.conf (outside http {}).
stream {
    map $ssl_preread_server_name $hm_upstream {
        turn.p2pchat.tech  127.0.0.1:5349;
        default            127.0.0.1:8443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $hm_upstream;
        proxy_connect_timeout 10s;
        # TURN allocations live for minutes: keep idle relayed connections open.
        proxy_timeout 30m;
    }
}
