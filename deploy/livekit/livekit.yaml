# LiveKit server for Hidden Messenger group calls (deploy/livekit/README.md, option B).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
keys:
  # API key: secret (32+ characters). The same pair goes into SFU_API_KEY / SFU_API_SECRET in hPanel. Never commit real values.
  REPLACE_WITH_API_KEY: REPLACE_WITH_A_LONG_RANDOM_SECRET
room:
  # Matches server/sfu.mjs DEFAULT_SFU_MAX_PARTICIPANTS.
  max_participants: 32
  empty_timeout: 300
logging:
  level: info
