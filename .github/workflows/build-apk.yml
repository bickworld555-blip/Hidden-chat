name: Build Android test APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_APP_URL: ${{ vars.ANDROID_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Validate app URL
        run: npm run android:configure
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build web assets and sync Android
        run: |
          npm run build
          npm run android:sync
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hidden-chat-release.jks"
          chmod 600 "$RUNNER_TEMP/hidden-chat-release.jks"
      - name: Provide Firebase config for push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json', 'utf8')).project_info.project_id"
            echo 'Firebase push: google-services.json provided.'
          else
            echo '::warning::GOOGLE_SERVICES_JSON secret is not set: this APK is built without Firebase push.'
          fi
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/hidden-chat-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Verify APK signature and collect artifact
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          mkdir apk-artifacts
          cp "$apk" apk-artifacts/Hidden-chat-release.apk
          (cd apk-artifacts && sha256sum Hidden-chat-release.apk > Hidden-chat-release.apk.sha256)
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-chat-release-${{ github.run_number }}
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hidden-chat-release.jks" android/app/google-services.json
