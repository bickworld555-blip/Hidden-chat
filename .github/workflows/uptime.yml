name: Uptime check

# Every 10 minutes: hiddenmessenger.com/api/v1/ready must answer {"status":"ok"} (the server is up and its database
# answers). A failed run is emailed by GitHub to the repository's watchers; with the repository secret
# ALERT_WEBHOOK_URL set, it also posts to that webhook (Slack, Discord, …).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check /api/v1/ready (3 tries)
        id: check
        shell: bash
        run: |
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' https://hiddenmessenger.com/api/v1/ready || true)
            if echo "$body" | grep -q '"status":"ok"'; then echo "up: $body"; exit 0; fi
            echo "attempt $attempt: ${body:-no answer}"
            sleep 20
          done
          exit 1
      - name: Alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            message='[Hidden Messenger] hiddenmessenger.com is not ready (uptime check failed 3 times).'
            curl -sS --max-time 10 -H 'Content-Type: application/json' -d "{\"text\":\"$message\",\"content\":\"$message\"}" "$ALERT_WEBHOOK_URL" || true
          fi

  xmpp:
    # The XMPP core on the VPS (chat.hiddenmessenger.com): a real WebSocket stream open must be answered with stream
    # features. The VPS checks itself too (deploy/ejabberd/backup/hm-health.cjs); this catches the VPS being down.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open an XMPP stream (3 tries)
        shell: bash
        run: |
          cat > probe.mjs <<'JS'
          const ws = new WebSocket('wss://chat.hiddenmessenger.com/xmpp-websocket', 'xmpp');
          const timer = setTimeout(() => { console.log('no stream features in 15 s'); process.exit(1); }, 15000);
          ws.onopen = () => ws.send("<open xmlns='urn:ietf:params:xml:ns:xmpp-framing' to='chat.hiddenmessenger.com' version='1.0'/>");
          ws.onmessage = ({ data }) => { if (String(data).includes('features')) { clearTimeout(timer); console.log('xmpp up'); ws.close(); process.exit(0); } };
          ws.onerror = () => { console.log('websocket error'); process.exit(1); };
          JS
          for attempt in 1 2 3; do node probe.mjs && exit 0; sleep 20; done
          exit 1
      - name: Alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            message='[Hidden Messenger] The XMPP core (chat.hiddenmessenger.com) does not answer (uptime check failed 3 times).'
            curl -sS --max-time 10 -H 'Content-Type: application/json' -d "{\"text\":\"$message\",\"content\":\"$message\"}" "$ALERT_WEBHOOK_URL" || true
          fi
