name: Release Windows desktop app

# Push a tag "desktop-v<version>" (matching desktop/package.json) to build the installer and the portable .exe on
# Windows and attach both to a GitHub Release of that tag. The website links to them (src/site/links.js).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "desktop-v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${version}"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Hidden Messenger for Windows ${{ github.ref_name }}
          body: |
            Hidden Messenger for Windows: the web companion, linked to your phone by QR code.

            - HiddenMessenger-Setup-*.exe installs for your user, with Start menu and desktop shortcuts.
            - HiddenMessenger-*-portable.exe runs without installing.

            The builds are not code-signed yet, so Windows SmartScreen may warn on first launch ("More info › Run anyway").
          files: |
            desktop/dist/HiddenMessenger-Setup-*.exe
            desktop/dist/HiddenMessenger-*-portable.exe
          fail_on_unmatched_files: true
      - name: Keep the builds (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: hidden-messenger-windows
          path: desktop/dist/*.exe
          retention-days: 14
